spring.application.name=ms-contacto
server.port=${PORT:8086}
server.address=${SERVER_ADDRESS:127.0.0.1}

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/gas_volcan_contacto}
spring.datasource.username=${DB_USER:gas_volcan_contacto_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:gasvolcan-auth}
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
