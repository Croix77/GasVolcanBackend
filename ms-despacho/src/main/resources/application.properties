spring.application.name=ms-despacho
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8085}
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:gasvolcan-auth}
app.servicios.pedidos=${PEDIDOS_URL:http://127.0.0.1:8084}
app.servicios.auth=${AUTH_URL:http://127.0.0.1:8081}
spring.jackson.deserialization.accept-float-as-int=false
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
