spring.application.name=ms-negocio
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/gas_volcan_negocio}
spring.datasource.username=${DB_USER:gas_volcan_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:gasvolcan-auth}
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.seed.catalogo=${APP_SEED_CATALOGO:false}

springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
spring.jackson.deserialization.accept-float-as-int=false
