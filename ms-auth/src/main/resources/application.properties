spring.application.name=ms-auth
server.port=${AUTH_PORT:8081}

spring.datasource.url=${AUTH_DB_URL:jdbc:mysql://127.0.0.1:3306/gas_volcan_auth}
spring.datasource.username=${AUTH_DB_USER:gas_volcan_auth_app}
spring.datasource.password=${AUTH_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${AUTH_DB_DDL_AUTO:update}
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:gasvolcan-auth}
app.jwt.expiration-ms=${AUTH_JWT_EXPIRATION_MS:3600000}
app.jwt.refresh-window-ms=${AUTH_JWT_REFRESH_WINDOW_MS:300000}
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

app.bootstrap.admin.enabled=${AUTH_BOOTSTRAP_ADMIN:false}
app.bootstrap.admin.nombre=${AUTH_ADMIN_NAME:}
app.bootstrap.admin.correo=${AUTH_ADMIN_EMAIL:}
app.bootstrap.admin.password=${AUTH_ADMIN_PASSWORD:}

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
