server.port=${PORT:8082}
server.address=${BIND_ADDRESS:127.0.0.1}
spring.application.name=ms-categorias
spring.datasource.url=${DB_URL:jdbc:h2:mem:categorias}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:gasvolcan-auth}
